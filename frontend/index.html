<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AiRTraffic Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">ATC</div>
        <div>
          <h1>AiRTraffic Control</h1>
          <p class="subtitle">Voice control plane for agent fleets</p>
        </div>
      </div>
      <div class="top-right">
        <span class="chip">Speechmatics Realtime</span>
        <div id="connBadge" class="badge idle">Idle</div>
      </div>
    </header>

    <section class="hero" id="listenPanel">
      <div class="hero-main">
        <div class="status-row">
          <span class="dot" id="liveDot"></span>
          <div class="listen-label" id="listenLabel">Ready to listen</div>
        </div>
        <div class="transcript">
          <div class="partial" id="partial"></div>
          <div class="final" id="final"></div>
        </div>
        <div class="controls">
          <button id="btnListen" class="btn btn-primary">Listen</button>
          <button id="btnStop" class="btn btn-secondary" disabled>Stop</button>
        </div>
        <p class="hint">Try “status”, “pause fake build”, or “kill log spam” then “confirm kill”.</p>
      </div>
      <div class="hero-side" id="orb" aria-hidden="true">
        <div class="meter">
          <div class="meter-ring"></div>
          <div class="meter-label">MIC</div>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="card-head">
          <h2>Workers</h2>
          <button id="btnRefresh" class="btn btn-ghost btn-sm">Refresh</button>
        </div>
        <div class="table-wrap">
          <table id="workersTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Status</th>
                <th>PID</th>
                <th>Target</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Audit</h2>
          <span class="muted">Before → after</span>
        </div>
        <ul id="auditList" class="audit"></ul>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Command</h2>
        <span class="muted">Text fallback</span>
      </div>
      <form id="textForm" class="command-row">
        <input id="textCmd" type="text" placeholder="Enter a command…" autocomplete="off" spellcheck="false" />
        <button type="submit" class="btn btn-primary btn-sm">Send</button>
      </form>
      <pre id="cmdResult" class="result"></pre>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
